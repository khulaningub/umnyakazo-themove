<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TheMove by Blockparty</title>
<style>
:root{--bg:#121212;--bg2:#050505;--card:#1b1b1b;--tx:#f4f4f4;--mu:#a3a3a3;--ln:#3a3a3a;--pk:#e0489f;--vi:#7c5cff;--bl:#2f7bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0b0714;z-index:20}
a{color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:rgba(11,7,20,.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;flex-wrap:wrap}
.logo{font-weight:900;font-style:italic;font-size:22px;letter-spacing:-.02em;text-decoration:none;text-transform:uppercase}
.logo b{color:var(--pk)}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav a{font-size:13px;font-weight:700;text-decoration:none;padding:6px 14px;border-radius:999px;color:var(--tx)}
nav a.on{background:linear-gradient(90deg,var(--vi),var(--bl))}
select,input,button{font:inherit;color:inherit}
.hero{position:relative;overflow:hidden;text-align:center;padding:70px 16px 80px;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.09) 42%,transparent 47%),linear-gradient(80deg,transparent 55%,rgba(255,255,255,.07) 58%,transparent 62%),radial-gradient(55% 80% at 15% 30%,rgba(255,43,214,.6),transparent 62%),radial-gradient(50% 70% at 85% 15%,rgba(41,120,255,.65),transparent 62%),radial-gradient(80% 60% at 50% 115%,rgba(124,92,255,.8),transparent 60%),#0b0714}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:90px;background:linear-gradient(transparent,var(--bg))}
.hero i{position:absolute;inset:auto 0 0;height:4px;background:linear-gradient(90deg,var(--vi),var(--pk),#fff);z-index:2}
.hero h1{position:relative;z-index:1;margin:0;font-size:clamp(46px,13vw,104px);line-height:.95;font-weight:900;font-style:italic;text-transform:uppercase;text-shadow:3px 0 #ff2bd6,-3px 0 #29d3ff;letter-spacing:.01em}
.hero p{position:relative;z-index:1;margin:10px 0 0;font-size:clamp(17px,3.6vw,28px);font-style:italic;opacity:.95}
main{max-width:860px;margin:0 auto;padding:20px 16px 50px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select{background:var(--bg);border:1px solid var(--ln);border-radius:4px;padding:9px 12px;font-size:13px}
.tools input{flex:1;min-width:150px}
.tools .sp{margin-left:auto}
.list{border-top:1px solid var(--ln)}
.row{display:grid;grid-template-columns:78px 84px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln)}
.dt{font-weight:800;font-size:13px;line-height:1.25}
.th{width:84px;aspect-ratio:4/5;border-radius:3px;display:flex;align-items:flex-end;padding:6px;font-size:9px;font-weight:900;text-transform:uppercase;line-height:1;background-size:cover;background-position:center;text-decoration:none;color:#fff;word-break:break-word}
.info h3{margin:0;font-size:clamp(16px,3.4vw,21px);text-transform:uppercase;letter-spacing:-.01em;line-height:1.1}
.info .m{color:#d6d6d6;font-size:13px;margin-top:6px;display:flex;align-items:center;gap:6px}
.tag{display:inline-block;background:var(--pk);font-size:10px;font-weight:800;padding:2px 9px;border-radius:999px;margin-bottom:6px}
.bt{display:grid;gap:8px;min-width:104px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #fff;background:transparent;border-radius:3px;padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;text-align:center}
.btn.pk{background:var(--pk);border-color:var(--pk)}
.btn.wa{background:#25d366;border-color:#25d366;color:#05260f}
.btn.on{background:#fff;color:#111}
.btn.lg{font-size:14px;padding:12px 18px}
.promo{margin:0 -16px;padding:34px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(105deg,transparent 60%,rgba(47,123,255,.5) 61%,transparent 66%),linear-gradient(90deg,#05301f,#0a2a6b 55%,#2a0a6b)}
.ico{width:64px;height:64px;border:2px solid #fff;display:grid;place-items:center;font-size:30px}
.promo span{font-size:clamp(18px,4vw,26px);font-style:italic;font-weight:300}
.pg{display:flex;justify-content:center;gap:10px;align-items:center;margin:26px 0 6px}
.pg button{width:22px;height:22px;border-radius:50%;border:1px solid #fff;background:none;font-size:10px;cursor:pointer;padding:0}
.pg button.on{background:var(--pk);border-color:var(--pk)}
.pg .ar{border:0;font-size:16px;width:auto}
.empty{color:var(--mu);padding:40px 0;text-align:center}
.back{display:inline-block;margin-bottom:14px;color:var(--mu);font-weight:700;text-decoration:none}
.ev{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.ev{grid-template-columns:300px minmax(0,1fr)}}
.big{aspect-ratio:4/5;border-radius:6px;display:flex;align-items:flex-end;padding:18px;font-size:38px;font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:-.02em;background-size:cover;background-position:center;word-break:break-word}
.ev h2{font-size:clamp(26px,6vw,38px);margin:0 0 12px;text-transform:uppercase;line-height:1}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.fact{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:10px 12px}
.fact small{display:block;color:var(--mu);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.pin{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0}
.going{font-size:34px;font-weight:900;color:var(--pk)}
.going small{font-size:14px;color:var(--mu);font-weight:700}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
h2.pt{font-size:clamp(28px,6vw,42px);text-transform:uppercase;font-style:italic;margin:0 0 10px}
form{display:grid;gap:14px;max-width:540px}
label{display:grid;gap:6px;font-weight:700;font-size:13px}
form input{background:var(--card);border:1px solid var(--ln);border-radius:4px;padding:11px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{color:var(--mu);font-size:14px}
.ok{background:var(--card);border:1px solid var(--pk);border-radius:6px;padding:14px;font-weight:700;margin:10px 0}
footer{background:var(--bg2);margin-top:20px}
.fg{max-width:860px;margin:0 auto;padding:40px 16px;display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
footer h4{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
footer p,footer a{font-size:12px;color:#ddd;display:block;margin:0 0 8px;text-decoration:none}
.sub{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sub input{width:100%;padding:9px;border-radius:3px;border:0;background:#fff;color:#111;font-size:12px}
.sub button{background:var(--pk);border:0;border-radius:3px;padding:8px 18px;font-size:11px;font-weight:800;cursor:pointer;color:#fff;text-transform:uppercase}
.soc{border-top:1px solid #222;text-align:center;padding:22px 16px 40px}
.soc div{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.soc span{width:26px;height:26px;border:1px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800}
.soc small{font-size:11px;color:#ccc}
.soc small b{color:var(--pk);font-weight:600}
@media(max-width:620px){.row{grid-template-columns:70px 72px minmax(0,1fr)}.th{width:72px}.bt{grid-column:1/-1;grid-template-columns:1fr 1fr}}
